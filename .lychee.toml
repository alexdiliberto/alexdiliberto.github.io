# --- Concurrency & retries ---
max_concurrency = 4
max_retries = 3
retry_wait_time = 4 # seconds
timeout = 45        # seconds

# --- Resolve root-relative links ---
base_url = "https://alexdiliberto.com"

# --- Friendlier UA ---
user_agent = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120 Safari/537.36"

# --- Accept status codes ---
accept = ["100..=103", "200..=299", 301, 302, 307, 308, 429]

# Do not cache rate-limit responses.
cache_exclude_status = [429]

# --- Skip historical content and generated sections ---
exclude_path = [
  "^\\./content/posts/201[4-9]-.*",
  "^\\./public/talks/.*"
]

# --- Ignore list ---
exclude = [
  # Non-HTTP resources
  "^mailto:",
  "^tel:",
  "^data:",
  "^file://.*",

  # Image/static asset URLs
  "\\.png$",
  "\\.jpe?g$",
  "\\.gif$",
  "\\.webp$",
  "\\.svg$",
  "\\.ico$",

  # CI/bot-hostile services
  "^https?://(www\\.)?reddit\\.com/submit.*",
  "^https?://news\\.ycombinator\\.com/submitlink.*",
  "^http://localhost(:\\d+)?/.*",
  "^https?://ember-fastboot\\.com/.*",
  "^https?://phaser\\.io/.*",
  "^https?://(www\\.)?webpagetest\\.org/.*",
  "^https?://(www\\.)?github\\.com/.*/blob/.*$",
  "^https?://azure\\.microsoft\\.com/en-us/services/cognitive-services/video-indexer/?$",
  "^https://webpack\\.js\\.org/?$",
  "^https://redux-saga\\.js\\.org/?$",
  "^https://web\\.archive\\.org/web/.*",

  # Common CI-bot-hostile content sites
  "^https?://(www\\.)?medium\\.com/.*",
  "^https?://(www\\.)?goodreads\\.com/.*",
  "^https://www\\.emberconf\\.com/?$",
  "^https://babeljs\\.io/?$",
  "^https://labs\\.planning\\.nyc\\.gov/?$",
  "^https://codepen\\.io/collection/AagvdL/?$",
  "^https://emberjs\\.com/editions/octane/?$",
  
  # Dead/unstable domains
  "^https?://lernajs\\.io/?$",

  # Non-content URLs
  "^https?://(www\\.)?facebook\\.com/sharer/sharer\\.php\\?.*$"
]
