name: Deploy Hugo to GitHub Pages

on:
  pull_request:
  push:
    # filtering branches here prevents duplicate builds from pull_request and push
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# separate concurrency for branches/PRs so previews don't block each other
concurrency:
  group: hugo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  HUGO_ENVIRONMENT: production
  HUGO_ENV: production
  GOTOOLCHAIN: local # enforce using the installed Go for all steps

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        # using Hugo Modules, not submodules
        with:
          submodules: false
          fetch-depth: 0 # needed for --enableGitInfo

      # Replace your Setup Go + Setup Hugo steps with this block
      - name: Setup Mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
        with:
          install: true # runs `mise install` (reads mise.toml)
          cache: true
          cache_key: "mise-{{platform}}-{{file_hash}}"

      - name: Go Toolchain Info (DEBUG)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        env:
          GOTOOLCHAIN: local # force Hugo to use the installed Go toolchain
        run: |
          echo "=============================="
          echo " Go Toolchain Info"
          echo "=============================="
          echo "-> go on PATH:"
          which go
          echo
          echo "-> go version:"
          go version
          echo
          echo "-> go env (selected keys):"
          go env GOPATH GOMODCACHE GOTOOLCHAIN
          echo
          echo "-> Triggering Hugo module operation (to ensure it shells out to go)..."
          hugo mod graph >/dev/null
          echo "[OK] Hugo successfully invoked go for module graph."
          echo "=============================="

      - name: Hugo Env Info (DEBUG)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          echo "=============================="
          echo " Hugo Environment Info"
          echo "=============================="
          which hugo
          hugo version
          echo
          echo "-> hugo env output:"
          hugo env
          echo "=============================="

      - name: Compute Go Cache Paths
        id: gopaths
        run: |
          echo "gomodcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "gobuildcache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.gopaths.outputs.gomodcache }}
            ${{ steps.gopaths.outputs.gobuildcache }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Hugo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/hugo
            resources/_gen
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.mod') }}-${{ hashFiles('**/go.sum') }}-${{ hashFiles('mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      # Surface module issues early (uses the Go toolchain above)
      - name: Hugo Modules Tidy
        run: |
          hugo mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Hugo Modules Verify
        run: hugo mod verify

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build /public
        run: |
          build_log="$(mktemp)"
          hugo --minify --gc --enableGitInfo 2>&1 | tee "$build_log"

          # PaperMod still calls two Hugo language methods deprecated in v0.158.0.
          # Fail on every other warning without vendoring or forking the theme.
          unexpected_warnings="$({
            grep '^WARN' "$build_log" || true
          } | grep -Ev 'deprecated: \.Language\.(LanguageDirection|LanguageCode)' || true)"

          if [ -n "$unexpected_warnings" ]; then
            echo "Unexpected Hugo warnings detected:"
            echo "$unexpected_warnings"
            exit 1
          fi

      # Fail if build produced no index
      - name: Verify Build Output
        run: test -s public/index.html || (echo "public/ is empty"; exit 1)

      # Always upload a normal artifact for downstream jobs
      - name: Upload Site Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site
          path: ./public
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      # Only upload the special Pages artifact when deploying from main
      - name: Upload Pages Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./public

  linkcheck:
    name: Link Check
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'dependencies'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      # - name: Download Site Artifact
      #   uses: actions/download-artifact@v7
      #   with:
      #     name: site
      #     path: ./public

      # - name: Restore Lychee Cache
      #   id: lychee-cache
      #   uses: actions/cache/restore@v6
      #   with:
      #     path: .lycheecache
      #     # commit-scoped primary key; broad restore for reuse
      #     key: ${{ runner.os }}-lychee-${{ github.sha }}-${{ hashFiles('.lychee.toml') }}
      #     restore-keys: |
      #       ${{ runner.os }}-lychee-

      # - name: Bust Lychee Cache (if needed)
      #   run: rm -f .lycheecache

      - name: Lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          fail: false
          args: >-
            --config .lychee.toml
            --format markdown
            --no-progress
            ./content
          output: lychee/out.md
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Save Lychee Cache
      #   if: steps.lychee.outputs.exit_code == '0'
      #   uses: actions/cache/save@v6
      #   with:
      #     path: .lycheecache
      #     # reuse the primary key from the restore step
      #     key: ${{ steps.lychee-cache.outputs.cache-primary-key }}
      
      - name: Fail if Lychee found broken links
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "Lychee found broken links"
          exit 1

  deploy:
    name: Deploy
    needs: [build, linkcheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  purge-cloudflare:
    name: Purge Cloudflare Cache
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: none
    steps:
      - name: Purge Cache
        uses: jakejarvis/cloudflare-purge-action@eee6dba0236093358f25bb1581bd615dc8b3d8e3 # v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
