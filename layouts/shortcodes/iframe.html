<iframe
  src="{{ .Get "src" }}"
  width="{{ .Get "width" }}"
  height="{{ .Get "height" }}"
  title="{{ .Get "title" }}"
  {{ with .Get "style" }}style="{{ . }}"{{ end }}
  loading="lazy"
  referrerpolicy="no-referrer"
  sandbox="allow-scripts allow-same-origin allow-popups"
  allowfullscreen
></iframe>
